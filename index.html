<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Şafak Kurt</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; touch-action: none;
    background: linear-gradient(180deg, #1d1838 0%, #4a2f5e 40%, #b45d6e 75%, #f0a77b 100%);
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H;
function resize() {
  const D = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  c.width = W * D; c.height = H * D;
  x.setTransform(D, 0, 0, D, 0, 0);
}
resize(); addEventListener('resize', resize);

const PI = Math.PI;
const cl = v => Math.max(0, Math.min(1, v));
const easeOut = v => 1 - Math.pow(1 - v, 3);
const easeBack = v => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(v - 1, 3) + c1 * Math.pow(v - 1, 2); };

/* Sabit rastgelelik */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* Günün rengi: Türkiye saatine göre (UTC+3), cihazın saat diliminden bağımsız.
   Gece yarısı (TR) renk sayfa yenilenmeden değişir. */
const TR_OFFSET = 3 * 60 * 60 * 1000;   // Türkiye sabit UTC+3, yaz saati yok

/* Cihaz saati yanlışsa sunucu saatiyle düzelt (sunucunun Date başlığı) */
let clockSkew = 0;
fetch(location.href, { method: 'HEAD', cache: 'no-store' })
  .then(r => {
    const d = r.headers.get('Date');
    if (d) clockSkew = new Date(d).getTime() - Date.now();
  })
  .catch(() => {});                      // başarısız olursa cihaz saatiyle devam

const nowMs = () => Date.now() + clockSkew;
const trDayNum = () => Math.floor((nowMs() + TR_OFFSET) / 86400000);

let dayNum = trDayNum();
let HUE = (dayNum * 137.508) % 360;

function updateHue() {
  const d = trDayNum();
  if (d !== dayNum) { dayNum = d; HUE = (d * 137.508) % 360; }
}

const hsl  = (dh, s, l)    => `hsl(${(HUE + dh + 360) % 360},${s}%,${l}%)`;
const hsla = (dh, s, l, a) => `hsla(${(HUE + dh + 360) % 360},${s}%,${l}%,${a})`;

/* Taç yaprak benekleri */
const spots = [];
for (let k = 0; k < 6; k++) {
  const arr = [];
  for (let i = 0; i < 9; i++) arr.push({ u: 0.15 + rnd() * 0.45, o: (rnd() - 0.5) * 1.3, r: 0.8 + rnd() * 1.4 });
  spots.push(arr);
}

/* Işık parçacıkları */
const bokeh = [];
for (let i = 0; i < 16; i++) bokeh.push({ x: rnd(), y: rnd(), r: 8 + rnd() * 30, s: 0.006 + rnd() * 0.015, p: rnd() * 6 });

function wind(t) {
  return Math.sin(t * 0.8) * 0.5 + Math.sin(t * 1.9 + 1) * 0.25 + Math.sin(t * 0.33 + 2) * 0.35;
}

function drawBokeh(t) {
  const k = Math.min(W, H) / 400;
  for (const b of bokeh) {
    const yy = (((b.y - t * b.s) % 1) + 1) % 1;
    const px = (b.x + Math.sin(t * 0.3 + b.p) * 0.02) * W, py = yy * H, r = b.r * k;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(255,210,180,0.16)');
    g.addColorStop(1, 'rgba(255,210,180,0)');
    x.fillStyle = g;
    x.beginPath(); x.arc(px, py, r, 0, PI * 2); x.fill();
  }
}

function drawLeaf(px, py, ang, L, side) {
  if (L < 1) return;
  x.save();
  x.translate(px, py); x.rotate(ang); x.scale(1, side);
  const g = x.createLinearGradient(0, -L * 0.18, 0, L * 0.1);
  g.addColorStop(0, '#8fcf6a'); g.addColorStop(1, '#2c6326');
  x.fillStyle = g;
  x.beginPath();
  x.moveTo(0, 0);
  x.bezierCurveTo(L * 0.25, -L * 0.2, L * 0.65, -L * 0.15, L, L * 0.06);
  x.bezierCurveTo(L * 0.6, L * 0.07, L * 0.25, L * 0.08, 0, 0);
  x.fill();
  x.strokeStyle = 'rgba(210,240,170,0.35)'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(L * 0.5, -L * 0.06, L * 0.95, L * 0.05); x.stroke();
  x.restore();
}

function drawPetal(cx, cy, ang, len, wid, curl, back, k, b, R) {
  const M = 20; let X = cx, Y = cy;
  const Lp = [], Rp = [], C = [];
  for (let j = 0; j <= M; j++) {
    const u = j / M, th = ang + curl * u * u;
    if (j > 0) { X += Math.cos(th) * len / M; Y += Math.sin(th) * len / M; }
    const ww = wid * 0.5 * Math.sin(PI * Math.pow(u, 0.7)) * (1 + 0.05 * Math.sin(u * 18 + k));
    const nx = -Math.sin(th), ny = Math.cos(th);
    Lp.push([X + nx * ww, Y + ny * ww]); Rp.push([X - nx * ww, Y - ny * ww]); C.push([X, Y, th, ww]);
  }
  const g = x.createRadialGradient(cx, cy, 0, cx, cy, len * 1.05);
  if (back) {
    g.addColorStop(0, hsl(-12, 90, 19)); g.addColorStop(0.3, hsl(-6, 88, 38));
    g.addColorStop(0.7, hsl(4, 82, 51));  g.addColorStop(1, hsl(14, 90, 60));
  } else {
    g.addColorStop(0, hsl(-12, 92, 25)); g.addColorStop(0.25, hsl(-4, 87, 45));
    g.addColorStop(0.65, hsl(6, 100, 56)); g.addColorStop(1, hsl(18, 100, 65));
  }
  x.fillStyle = g;
  x.beginPath(); x.moveTo(cx, cy);
  for (const p of Lp) x.lineTo(p[0], p[1]);
  for (let j = Rp.length - 1; j >= 0; j--) x.lineTo(Rp[j][0], Rp[j][1]);
  x.closePath(); x.fill();
  x.strokeStyle = hsla(-10, 100, 24, 0.35); x.lineWidth = 1; x.stroke();

  x.strokeStyle = 'rgba(255,225,150,0.45)'; x.lineWidth = 1.3;
  x.beginPath(); x.moveTo(cx, cy);
  for (let j = 1; j <= M * 0.85; j++) x.lineTo(C[j][0], C[j][1]);
  x.stroke();

  if (b > 0.2) {
    x.fillStyle = hsla(-10, 85, 15, 0.85 * cl((b - 0.2) / 0.5));
    for (const s of spots[k]) {
      const p = C[Math.round(s.u * M)], off = s.o * p[3] * 0.6;
      x.beginPath();
      x.arc(p[0] - Math.sin(p[2]) * off, p[1] + Math.cos(p[2]) * off, s.r * R / 100, 0, PI * 2);
      x.fill();
    }
  }
}

const start = performance.now();
function frame(now) {
  updateHue();
  const t = (now - start) / 1000;
  x.clearRect(0, 0, W, H);
  drawBokeh(t);

  const grow = easeOut(cl(t / 0.5));
  const b = easeBack(cl((t - 0.3) / 0.9));
  const R = Math.min(W * 0.3, H * 0.17);
  const stemLen = H * 0.56;
  const w = wind(t);

  /* Sap noktaları */
  const N = 26, seg = stemLen * grow / N;
  let px = W / 2, py = H + 8;
  const pts = [{ x: px, y: py, a: -PI / 2 }];
  for (let i = 0; i < N; i++) {
    const u = (i + 1) / N;
    const a = -PI / 2 + 0.1 * u + w * 0.11 * Math.pow(u, 1.7);
    px += Math.cos(a) * seg; py += Math.sin(a) * seg;
    pts.push({ x: px, y: py, a });
  }

  /* Yapraklar */
  const leaves = [[5, 1, 1.35], [9, -1, 1.15], [14, 1, 0.85]];
  leaves.forEach(([idx, side, sz], i) => {
    const lg = easeOut(cl((t - 0.1 - i * 0.08) / 0.5));
    const p = pts[idx];
    drawLeaf(p.x, p.y, p.a + side * 0.8 + Math.sin(t * 2.1 + i * 1.7) * 0.07, R * sz * lg, side);
  });

  /* Sap */
  const wB = Math.max(4, R * 0.075), wT = wB * 0.5;
  x.beginPath();
  for (let i = 0; i <= N; i++) {
    const p = pts[i], ww = (wB + (wT - wB) * i / N) / 2;
    const nx = Math.cos(p.a + PI / 2), ny = Math.sin(p.a + PI / 2);
    i === 0 ? x.moveTo(p.x + nx * ww, p.y + ny * ww) : x.lineTo(p.x + nx * ww, p.y + ny * ww);
  }
  for (let i = N; i >= 0; i--) {
    const p = pts[i], ww = (wB + (wT - wB) * i / N) / 2;
    const nx = Math.cos(p.a + PI / 2), ny = Math.sin(p.a + PI / 2);
    x.lineTo(p.x - nx * ww, p.y - ny * ww);
  }
  x.closePath(); x.fillStyle = '#3d7a2c'; x.fill();
  x.strokeStyle = 'rgba(180,230,130,0.35)'; x.lineWidth = wB * 0.25;
  x.beginPath(); x.moveTo(pts[0].x - 1, pts[0].y);
  for (let i = 1; i <= N; i++) x.lineTo(pts[i].x - wB * 0.15, pts[i].y);
  x.stroke();

  /* Çiçek */
  const head = pts[N];
  const ha = head.a + Math.sin(t * 1.4) * 0.05 + w * 0.05;
  const cx = head.x, cy = head.y;

  if (b > 0) {
    const gl = x.createRadialGradient(cx, cy, 0, cx, cy, R * 2.3);
    gl.addColorStop(0, hsla(5, 100, 68, 0.28 * cl(b)));
    gl.addColorStop(1, hsla(5, 100, 68, 0));
    x.fillStyle = gl; x.beginPath(); x.arc(cx, cy, R * 2.3, 0, PI * 2); x.fill();
  }

  for (const k of [1, 3, 5, 0, 2, 4]) {
    const back = k % 2 === 1;
    const off = (k - 2.5) * PI / 3;
    const ang = ha + off * b + Math.sin(t * 2.6 + k) * 0.025 * b;
    const len = R * (back ? 0.92 : 1) * (0.45 + 0.55 * b) * grow;
    const wid = R * (back ? 0.42 : 0.5) * (0.35 + 0.65 * Math.min(b, 1));
    const curl = 0.45 * b * (back ? -1 : 1);
    drawPetal(cx, cy, ang, len, wid, curl, back, k, b, R);
  }

  /* Ercikler */
  const sp = cl((b - 0.45) / 0.55);
  if (sp > 0) {
    const lw = Math.max(1.2, R * 0.013);
    for (let k = 0; k < 6; k++) {
      const a = ha + ((k - 2.5) * PI / 3 + 0.3) * b + Math.sin(t * 3 + k) * 0.03;
      const len = R * 0.8 * sp;
      const ex = cx + Math.cos(a) * len, ey = cy + Math.sin(a) * len;
      const qx = cx + Math.cos(a - 0.35) * len * 0.6, qy = cy + Math.sin(a - 0.35) * len * 0.6;
      x.strokeStyle = '#e2ebae'; x.lineWidth = lw;
      x.beginPath(); x.moveTo(cx, cy); x.quadraticCurveTo(qx, qy, ex, ey); x.stroke();
      x.fillStyle = '#8a3410';
      x.beginPath(); x.ellipse(ex, ey, R * 0.065, R * 0.022, a + PI / 2, 0, PI * 2); x.fill();
    }
    const pa = ha + 0.1, pl = R * 0.95 * sp;
    const tx = cx + Math.cos(pa) * pl, ty = cy + Math.sin(pa) * pl;
    x.strokeStyle = '#c9e39a'; x.lineWidth = lw * 1.6;
    x.beginPath(); x.moveTo(cx, cy);
    x.quadraticCurveTo(cx + Math.cos(pa + 0.2) * pl * 0.5, cy + Math.sin(pa + 0.2) * pl * 0.5, tx, ty);
    x.stroke();
    x.fillStyle = '#6f9a3c'; x.beginPath(); x.arc(tx, ty, R * 0.035, 0, PI * 2); x.fill();
  }

  if (b > 0) {
    const cg = x.createRadialGradient(cx, cy, 0, cx, cy, R * 0.2);
    cg.addColorStop(0, 'rgba(255,224,138,' + 0.9 * cl(b) + ')');
    cg.addColorStop(1, 'rgba(255,224,138,0)');
    x.fillStyle = cg; x.beginPath(); x.arc(cx, cy, R * 0.2, 0, PI * 2); x.fill();
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
